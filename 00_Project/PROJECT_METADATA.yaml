immediate_next_step:
  id: W02_C002_implementation_preparation
  text: >-
    Подготовить реализацию C002 строго по замороженной и принятой execution specification v1.0.
    Разрешена только implementation preparation; C002 execution и detector access к отложенной выборке
    не авторизованы.
do_not_assume:
  - Восемь BF-ID соответствуют восьми различным физическим возбуждениям.
  - Любая BF-запись уже сопоставлена с legacy-идентификатором F002 или F004.
  - Особенность около 18.25 meV уже окончательно доказана как CEF-переход Dy3+.
  - Энергии 6.45 и 27.90 meV являются результатами слепого обнаружения или подтверждёнными CEF-уровнями.
  - F002 и F004 являются индексами кристаллографических отражений.
  - Особенность около 44.4 meV является чистым локализованным Dy CEF-переходом.
  - Один energy-only optimum определяет физическую CEF-модель.
  - Параметры effective-charge PCM являются непосредственно измеренными ионными зарядами.
  - Magnetic exchange уже включён в текущий CEF baseline.
  - Exchange-charge model Малкина является активной моделью текущего цикла.

