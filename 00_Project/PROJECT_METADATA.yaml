scientific_question: >
  Определить воспроизводимый и физически интерпретируемый эффективный
  гамильтониан кристаллического поля Dy3+ в DyFeO3, согласованный прежде
  всего с энергиями и интенсивностями INS-переходов, а затем проверенный
  независимыми магнитными наблюдаемыми.

scientific_facade:
  current_scientific_question: >
    Сможет ли исправленная и принятая реализация C-001 v1.1 после отдельной авторизации повторного запуска
    сформировать на данных для поиска и метаданных отложенной выборки без
    детекторных полей самодостаточную модель и реестр гипотез для будущего C-002,
    сохранив каталог B-001 и границы слепого анализа?
  stage02r_purpose: >
    Stage 02R формирует независимый от CEF-модели слой экспериментальных
    свидетельств до нового цикла физического назначения и CEF-моделирования.
    Это уменьшает риск замкнутого анализа, при котором ожидаемые энергии
    или предсказания модели одновременно задают искомые признаки и служат
    основанием для проверки той же модели.
