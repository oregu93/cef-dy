project_id: CEF-Dy
project_status: active
schema_version: '2.2'
updated: '2026-09-01'

scientific_question: >
  Определить воспроизводимый и физически интерпретируемый эффективный
  гамильтониан кристаллического поля Dy3+ в DyFeO3, согласованный прежде
  всего с энергиями и интенсивностями INS-переходов, а затем проверенный
  независимыми магнитными наблюдаемыми.

experimental_evidence_summary: >
  В blind-анализе TAIPAN обнаружена спектральная особенность F002 около
  18.2–18.3 meV. Последующий профильный анализ дал рабочую оценку положения
  E_peak ≈ 18.25 ± 0.12 meV. F002 является последовательным feature ID,
  а не индексом отражения. Также наблюдается широкая особенность F004
  около 44.4 meV с пока не установленным микроскопическим происхождением.

interpretation_summary: >
  Особенность около 18.25 meV рассматривается как основной кандидат на
  CEF-переход Dy3+, но это назначение остаётся рабочей гипотезой.
  Энергии 6.45 и 27.90 meV являются историческими target energies
  прежних B1/B2 energy-only поисков; их первичный литературный provenance
  ещё не восстановлен.

model_status_summary: >
  Formal-charge PCM и M0/M1 сохраняются как ограниченные структурно
  мотивированные модельные семейства. Energy-only 15-параметрическая
  CEF-задача существенно недоопределена. Stage 03D M0/M1 design сохранён,
  но production execution приостановлен до независимого повторного анализа
  экспериментального observation set.

main_uncertainties:
  - Не установлен уникальный полный 15-параметрический CEF-гамильтониан и соответствующие волновые функции.
  - Окончательное CEF-назначение особенности около 18.25 meV не подтверждено интенсивностями и другими независимыми наблюдаемыми.
  - Первичный литературный provenance энергий 6.45 и 27.90 meV не восстановлен.
  - Физическая природа особенности около 44.4 meV остаётся открытой.
  - Не определены окончательные systematic uncertainty энергетической шкалы и TAS resolution model.
  - Не установлена достаточность CEF-only описания низкотемпературных данных.

current_milestone:
  id: M00C
  title: Stage 00C — scientific re-baselining and provenance audit
  status: active

immediate_next_step:
  id: T-00C-06
  text: >
    Завершить управляющий re-baseline Knowledge Base: синхронизировать
    PROJECT_CONTROL, PROJECT_MANIFEST, protocols и automation с новой
    evidence/model semantics, после чего выполнить consistency review,
    kb_refresh и kb_validate.

do_not_assume:
  - Особенность около 18.25 meV уже окончательно доказана как CEF-переход Dy3+.
  - Энергии 6.45 и 27.90 meV являются blind experimental detections или подтверждёнными CEF-уровнями.
  - F002 и F004 являются индексами кристаллографических отражений.
  - Особенность около 44.4 meV является чистым локализованным Dy CEF-переходом.
  - Один energy-only optimum определяет физическую CEF-модель.
  - Параметры effective-charge PCM являются непосредственно измеренными ионными зарядами.
  - Magnetic exchange уже включён в текущий CEF baseline.
  - Exchange-charge model Малкина является активной моделью текущего цикла.

