    outcome: accepted_with_limitations
    catalogue_feature_count: 8
    catalogue_count_control_mode: monitor_controlled
    catalogue_tier_1_count: 8
    catalogue_tier_2_count: 0
    excluded_tier_0_cluster_count: 3
    cross_mode_position_recurrence_count: 0
