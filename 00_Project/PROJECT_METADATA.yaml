experimental_evidence_summary: >
  В B-001 из 75 пригодных энергетических сканов 57 использованы для поиска,
  а 18 заранее отнесены к отложенной выборке. Замороженный каталог содержит
  восемь monitor_controlled BF с Tier-1; Tier-2 и межрежимной повторяемости
  положения нет. Один скан для поиска (`discovery`) исключён по замороженному
  численному правилу nuisance_field_fit_failure без повторного расчёта и замещения.

interpretation_summary: >
  BF-ID являются алгоритмическими кластерами воспроизводимости, а не
  физическими назначениями. B-001 не устанавливает число различных
  возбуждений и не выполняет CEF-назначение. Legacy-идентификаторы F002/F004
  принадлежат прежнему слою анализа; их связь с BF-* не установлена.

model_status_summary: >
  Formal-charge PCM и M0/M1 сохраняются как ограниченные структурно
  мотивированные модельные семейства. Пятнадцатипараметрическая обратная
  CEF-задача при подгонке только по энергиям существенно недоопределена.
  Проект Stage 03D M0/M1 сохранён, но вычислительное исполнение приостановлено
  до независимого повторного формирования набора экспериментальных наблюдаемых.

main_uncertainties:
  - Не установлен уникальный полный 15-параметрический CEF-гамильтониан и соответствующие волновые функции.
  - Окончательное CEF-назначение особенности около 18.25 meV не подтверждено интенсивностями и другими независимыми наблюдаемыми.
  - Первичный литературный provenance энергий 6.45 и 27.90 meV не восстановлен; физическая природа особенности около 44.4 meV остаётся открытой.
  - Не установлена эпистемическая связь legacy-идентификаторов F002/F004 с новым каталогом BF-*.
  - Перекрывающиеся BF-интервалы не разрешены на отдельные физические линии; Tier-2 отсутствует, один скан для поиска исключён численно, а отказы отдельных окон ограничивают выводы об устойчивости B-001.
  - Не определены окончательная систематическая неопределённость энергетической шкалы и модель разрешения TAS; достаточность CEF-only описания низкотемпературных данных не установлена.

