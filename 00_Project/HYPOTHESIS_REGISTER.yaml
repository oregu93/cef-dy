- id: H-001
  title: Особенность около 18.25 meV относится к CEF-переходу Dy3+
  status: working
  statement: >
    Экспериментальная спектральная особенность около 18.25 meV
    рассматривается как основной кандидат проекта на переход между
    CEF-состояниями Dy3+.
  supporting_evidence:
    - EV-001
    - EV-002
  supporting_results: []
  consistency_results:
    - R-006
  conflicting_results: []
  tests_required:
    - Проверить относительные INS-интенсивности на очищенном observation set.
    - Проверить Q-зависимость.
    - Проверить температурную зависимость.
    - Проверить transition matrix elements и selection rules.
    - Проверить совместимость с общей CEF level scheme.
  notes: >
    R-006 является только conditioned model-consistency result и не считается
    независимым evidence для H-001.


- id: H-002
  title: M1 может дать информативное улучшение относительно M0
  status: candidate
  statement: >
    Различение effective contributions двух кристаллографически
    неэквивалентных oxygen sites может изменить CEF wavefunctions и
    INS intensity pattern относительно uniform-scale M0.
  supporting_evidence: []
  supporting_results: []
  motivation_results:
    - R-006
    - R-007
  conflicting_results: []
  tests_required:
    - Сначала сформировать независимый Stage 02R observation contract.
    - Проверить в Stage 03R, какие observables реально различают M0 и M1.
    - Только затем выполнять nested M0/M1 comparison.
  notes: >
    Текущие результаты мотивируют тест M1, но ещё не являются evidence,
    что M1 действительно улучшает описание данных.


- id: H-003
  title: CEF scheme содержит переходы около 6.45 и/или 27.90 meV
  status: candidate
  statement: >
    Энергии 6.45 и 27.90 meV использовались в historical B1/B2 assignment
    tracks, однако они не являются blind experimental detections текущего
    TAIPAN analysis, а их первичный литературный provenance пока не восстановлен.
  supporting_evidence: []
  supporting_results: []
  historical_target_evidence:
    - EV-004
    - EV-005
  diagnostic_results:
    - R-006
  conflicting_results: []
  completed_prerequisites:
    - B-001 завершил слепой поиск спектральных особенностей как R-012 / EV-007 без исторического сопоставления и без CEF-назначения.
  tests_required:
    - Восстановить первичные литературные источники обеих энергий.
    - До отдельного design review T-02R-05 не сопоставлять historical target energies с каталогом BF-*.
    - В отдельном design review заранее определить targeted sensitivity / upper-limit tests; не выполнять их без разрешения.
    - Проверить возможные transition strengths в admissible CEF models.
  notes: >
    Отсутствие таких переходов в conditioned PCM R-006 не доказывает их
    физическое отсутствие. Поэтому прежний status disfavored заменён на candidate.


- id: H-004
  title: Особенность около 44.4 meV является чистым локализованным Dy CEF-переходом
  status: disfavored
  statement: >
    Простое назначение особенности F004 одному чистому локализованному
    Dy3+ CEF-переходу в настоящее время считается неблагоприятным,
    однако микроскопическая природа особенности остаётся открытой.
  relevant_evidence:
    - EV-003
  supporting_results: []
  conflicting_results:
    - R-005
  tests_required:
    - Независимо воспроизвести Q-dependence в Stage 02R.
    - Исследовать температурную зависимость.
    - Проверить CEF, phonon, Fe-related и mixed branches.
