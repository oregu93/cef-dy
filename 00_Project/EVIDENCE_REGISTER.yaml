- id: EV-006
  type: instrument_spectral_parameter
  title: Historical empirical elastic width from TAIPAN scan 104062
  origin_type: experiment_derived
  review_status: reviewed
  provenance_status: partial

  value:
    quantity: elastic_fwhm
    reported_value_meV: 0.894
    reported_sigma_meV: 0.025
    Q_Ainv: 2.26

  dataset_id: EXP-TAIPAN-001
  scan_ids:
    - "104062"

  statement: >
    Historical analysis of elastic scan 104062 reported an empirical
    effective energy width FWHM = 0.894 ± 0.025 meV near Q ≈ 2.26 A^-1.
    This quantity is not a complete TAS resolution function.

  validation_required:
    - recover the original scan 104062 analysis artifact
    - reproduce the elastic-line fit
    - document the line-shape and uncertainty model