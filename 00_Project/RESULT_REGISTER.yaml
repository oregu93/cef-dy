- id: R-002
  title: Недоопределённость energy-only 15-параметрической обратной задачи CEF
  type: inverse_problem_result
  status: reviewed
  scope:
    - identifiability
    - global_search
    - MOD-CEF-CS15
  statement: >
    Предыдущие глобальные energy-only поиски дали существенно различные
    CEF-гамильтонианы, схемы уровней и волновые функции при близких значениях
    целевой функции. Один численный energy-only optimum не определяет
    уникальную физическую CEF-модель.
  evidence:
    - kind: legacy_summary
      source: Archive/legacy/DyFeO3_PROJECT_STATE_v1.1.md
  review_date: '2026-08-28'
  validation_criteria:
    - Связать результат с таблицами полного ансамбля решений и логами глобального поиска.
  limitations: >
    Этот результат устанавливает недоопределённость исторической energy-only
    постановки, но ничего сам по себе не доказывает о существовании конкретных
    уровней или переходов.


