- id: R-001
  title: Численное соответствие direct PCF и direct CFE для benchmark-набора
  type: numerical_crosscheck
  status: reviewed
  scope:
  - operator_convention
  - direct_basis
  statement: В предыдущем benchmark соглашений гамильтонианы direct PCF и direct CFE
    совпали с точностью, близкой к машинной; сообщалось max|ΔH| порядка 8.9e-16 meV.
  evidence:
  - kind: legacy_summary
    source: Archive/legacy/KnowledgeBase_v2.0/00_Project/PROJECT_STATE.md
  review_date: '2026-08-28'
  validation_criteria:
  - Повторный запуск benchmark из сохранённого кода и входных данных.
  - Связать результат с отдельным checkpoint/artifact.
  notes: 'Статус intentionally reviewed, а не validated: в текущем пакете нет привязанного
    воспроизводимого benchmark artifact.'
- id: R-002
  title: Недоопределённость energy-only 15-параметрического CEF-фита
  type: inverse_problem_result
  status: reviewed
  scope:
  - identifiability
  - global_search
  statement: Глобальные поиски дали существенно различные CEF-схемы с близкими значениями
    функции потерь, построенной только по энергиям; один энергетический минимум не
    выбирает уникальные волновые функции.
  evidence:
  - kind: legacy_summary
    source: Archive/legacy/DyFeO3_PROJECT_STATE_v1.1.md
  review_date: '2026-08-28'
  validation_criteria:
  - Связать с таблицами полного ансамбля решений/логами глобального поиска.
- id: R-003
