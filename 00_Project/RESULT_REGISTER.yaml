- id: R-009
  title: Stage 02R A-001 TAIPAN raw-archive reconnaissance
  type: data_reconnaissance_result
  status: reviewed
  scope:
    - Stage02R
    - TAIPAN
    - raw_archive
    - acquisition_semantics
  statement: >
    Fresh CEF-blind reconnaissance of EXP-TAIPAN-001 established 201 readable
    .dat files with zero exact-content duplicates and empirically verified
    one-file-to-one-logical-scan representation. The archive contains
    21 deterministic structural format families. Raw detector, monitor,
    time, h, k, l, e, ei, vei and ef fields are present throughout the
    archive; 103 scans are monitor-controlled and 98 are time-controlled.
    The archive contains two lattice states and four UB matrices, and proper
    acquisition timestamps cover 2023-08-29 through 2023-09-06. Pre/post
    source census remained byte-identical.
  evidence:
    - kind: work_checkpoint
      source: 02_Work_Checkpoints/W02-02R-A-001.md
    - kind: result_package
      source: 04_Results/Stage02R/W02-02R-A-001/
  review_date: '2026-09-02'
  validation_criteria:
    - Verify the tracked A-001 artifact checksums against the reviewed checkpoint.
    - Verify a second-machine copy of EXP-TAIPAN-001 against the reviewed source census before later execution.
  limitations: >
    Several semantics remain intentionally unresolved after A-001, including
    mode=0, q, qh versus h, en versus e, explicit filter/higher-order
    suppression state, PG reflection/mosaic, and several auxiliary motor
    fields. These must not be assigned by assumption in A-002.

- id: R-010
  title: Stage 02R A-002 verified TAIPAN parser and acquisition semantics
  type: data_parser_and_semantics_result
  status: reviewed
  scope:
    - Stage02R
    - TAIPAN
    - parser
    - acquisition_semantics
    - canonical_inventory
  statement: >
    W02-02R-A-002 сформировал canonical lossless acquisition representation
    EXP-TAIPAN-001: 201 raw files соответствуют 201 logical scans, содержащим
    7761 measured points во всех 21 reviewed structural format families.
    Для raw energy fields relation e = Ei - Ef verified для всех 7761 points
    по frozen decimal-precision tolerance rule; mapping def_x=en к
    point-level e verified для всех 85 соответствующих scans. Семантика
    h/k/l является acquisition-consistent и partially verified, тогда как
    raw q и mode=0 намеренно остаются unresolved. Parser воспроизводит
    103 monitor-controlled и 98 time-controlled scans, 2 lattice states и
    4 UB states, сохраняя raw detector, monitor и time отдельно и без
    normalization.
  evidence:
    - kind: work_checkpoint
      source: 02_Work_Checkpoints/W02-02R-A-002.md
    - kind: result_package
      source: 04_Results/Stage02R/W02-02R-A-002/
  review_date: '2026-09-03'
  validation_criteria:
    - Verify tracked A-002 artifact checksums against the reviewed checkpoint and provenance manifest.
    - Verify externally stored scan_point_auxiliary.csv by exact byte size and SHA-256.
    - Preserve the distinction between verified, partially verified and unresolved raw-field semantics.
  limitations: >
    Scientific review was based on the reported checkpoint/results and did
    not independently rerun the raw dataset or independently byte-open every
    local artifact. Independent Windows/Linux reproduction was not performed.
    mode=0, q, filter/higher-order suppression state, attenuation, PG
    reflection/mosaic and several auxiliary-motor semantics remain unresolved.
    A-002 performed no normalization, acquisition/instrument block inference,
    resolution calculation, spectral feature analysis or CEF analysis.

- id: R-011
  title: Stage 02R A-003 acquisition/configuration and normalization-compatibility classification
  type: acquisition_configuration_classification_result
  status: reviewed
  scope:
    - Stage02R
    - TAIPAN
    - acquisition_state
    - instrument_configuration
    - normalization_compatibility
  statement: >
    W02-02R-A-003 classified all 201 canonical TAIPAN scans using the frozen
    metadata-only Stage 02R rules. It produced 46 recorded acquisition-state
    classes, one recorded_verified_configuration_equivalence instrument class
    (PG monochromator, PG analyzer, o-40-40-o collimation), 85 acquisition-state
    boundaries, no verified normalization-relevant reconfiguration boundary and
    one normalization epoch. Of all 20100 unordered scan pairs, 10094
    cross-control-mode pairs are not_supported and all 10006 same-control-mode
    pairs are conditionally_supported; none are fully supported or unresolved.
    The exact-key normalization-compatibility partition therefore contains two
    conditionally_supported groups: 103 monitor-controlled scans and 98
    time-controlled scans. No numerical normalization was performed.
  evidence:
    - kind: work_checkpoint
      source: 02_Work_Checkpoints/W02-02R-A-003.md
    - kind: result_package
      source: 04_Results/Stage02R/W02-02R-A-003/
    - kind: artifact
      source: 04_Results/Stage02R/W02-02R-A-003/external_artifacts.yaml
  review_date: '2026-09-03'
  limitations: >
    Scientific review was based on the reported checkpoint/results and did not
    independently open all local artifacts, independently byte-verify the full
    package or rerun raw data. One instrument-config class proves equality only
    of the frozen verified v1 fields, not complete physical configuration.
    Filter state, higher-order suppression, attenuation, monochromator/analyzer
    reflection, detector/monitor hardware identity and other unresolved
    configuration dimensions prevent promotion of same-mode compatibility from
    conditionally_supported to supported. The two compatibility groups are not
    established numerical scale parameters.
  validation_criteria:
    - Verify tracked A003 artifact checksums against checkpoint/provenance.
    - Verify external normalization_compatibility.csv by exact byte size and SHA-256.
    - Preserve 20100-pair accounting and 103/98 count-control separation.
    - Do not interpret normalization compatibility as normalization already performed.
