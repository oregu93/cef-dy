- id: R-006
  title: Conditioned Stage 03C uniform-PCM transition diagnostic
  type: model_diagnostic
  status: reviewed
  scope:
    - Stage03C
    - MOD-PCM-M0
    - selection_rules
  statement: >
    В Stage 03C равномерно масштабированный full-cluster PCM был явно
    настроен так, чтобы первый переход находился около 18.247 meV.
    При этом условии первый переход оставался доминирующим, отдельного
    перехода около 6.45 meV модель не давала, а рассчитанная сила около
    27.90 meV была крайне малой относительно главного перехода.
  conditioned_on:
    - first_transition_scaled_to_approximately_18.247_meV
  evidence:
    - kind: legacy_summary
      source: Archive/legacy/KnowledgeBase_v2.0/00_Project/PROJECT_STATE.md
  review_date: '2026-08-28'
  validation_criteria:
    - Привязать Stage 03C outputs и скрипт как checkpoint/source artifact.
  limitations: >
    Результат является consistency diagnostic после conditioning на
    экспериментальную энергию. Он не является независимым evidence в пользу
    CEF assignment особенности 18.25 meV и не доказывает физическое отсутствие
    уровней около 6.45 или 27.90 meV.


