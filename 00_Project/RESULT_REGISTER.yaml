- id: R-005
  title: Legacy Q-dependence diagnostic for the feature near 44.4 meV
  type: experimental_model_diagnostic
  status: reviewed
  scope:
    - TAIPAN
    - F004
    - assignment_diagnostic
  statement: >
    В историческом анализе Q-зависимость особенности около 44.4 meV
    не показала ожидаемого достаточно сильного согласия с простой моделью
    одного чистого локализованного Dy CEF-перехода. Этот результат ослабляет
    такое назначение, но не устанавливает микроскопическую природу особенности.
  evidence:
    - kind: legacy_summary
      source: Archive/legacy/DyFeO3_PROJECT_STATE_v1.1.md
  review_date: '2026-08-28'
  validation_criteria:
    - Восстановить таблицу profile fits и Q-dependence artifact.
    - Повторить анализ после независимого Stage 02R.
  limitations: >
    Сам факт существования спектральной особенности F004 хранится отдельно
    как experimental evidence. Этот result относится только к diagnostic
    проверки конкретного assignment.


- id: R-006
  title: Conditioned Stage 03C uniform-PCM transition diagnostic
  type: model_diagnostic
  status: reviewed
  scope:
    - Stage03C
    - MOD-PCM-M0
    - selection_rules
  statement: >
    В Stage 03C равномерно масштабированный full-cluster PCM был явно
    настроен так, чтобы первый переход находился около 18.247 meV.
    При этом условии первый переход оставался доминирующим, отдельного
    перехода около 6.45 meV модель не давала, а рассчитанная сила около
    27.90 meV была крайне малой относительно главного перехода.
  conditioned_on:
    - first_transition_scaled_to_approximately_18.247_meV
  evidence:
    - kind: legacy_summary
      source: Archive/legacy/KnowledgeBase_v2.0/00_Project/PROJECT_STATE.md
  review_date: '2026-08-28'
  validation_criteria:
    - Привязать Stage 03C outputs и скрипт как checkpoint/source artifact.
  limitations: >
    Результат является consistency diagnostic после conditioning на
    экспериментальную энергию. Он не является независимым evidence в пользу
    CEF assignment особенности 18.25 meV и не доказывает физическое отсутствие
    уровней около 6.45 или 27.90 meV.


- id: R-007
  title: Stage 03C detected-only normalization selection bias
  type: statistical_diagnostic
  status: reviewed
  scope:
    - Stage03C
    - F002
    - normalization
  statement: >
    В историческом Stage 03C анализе нормировка, оцененная только по
    detected profiles feature F002, переоценивала предсказанный сигнал
    в профилях без обнаружения. Это показывает необходимость сохранять
    информацию non-detections и физически обоснованные связи нормировки
    между совместимыми scans.
  evidence:
    - kind: legacy_summary
      source: Archive/legacy/KnowledgeBase_v2.0/00_Project/PROJECT_STATE.md
  review_date: '2026-08-28'
  validation_criteria:
    - Привязать profile-area table и Stage 03C audit outputs.
  limitations: >
    Конкретная likelihood/censoring implementation для нового inference
    должна быть заново определена после Stage 02R observation contract.


