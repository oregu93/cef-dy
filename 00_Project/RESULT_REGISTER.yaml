- id: R-006
  title: 'Stage 03C: screened PCM воспроизводит сильный первый переход, но не поддерживает
    обязательные 6.45/27.90 meV'
  type: model_diagnostic
  status: reviewed
  scope:
  - Stage03C
  - PCM
  - selection_rules
  statement: Для равномерно экранированного PCM полного кластера первый переход настроен
    к 18.247 meV и остаётся доминирующим; переход около 6.45 meV отсутствует, а рассчитанная
    сила около 27.90 meV остаётся крайне малой относительно главной линии.
  evidence:
  - kind: legacy_summary
    source: Archive/legacy/KnowledgeBase_v2.0/00_Project/PROJECT_STATE.md
  review_date: '2026-08-28'
  validation_criteria:
  - Привязать Stage 03C outputs и скрипт как checkpoint/source artifact.
- id: R-007
  title: 'Stage 03C: нормировка только по обнаруженным профилям создаёт selection
    bias'
  type: statistical_diagnostic
  status: reviewed
  scope:
  - Stage03C
  - F002
  - normalization
  statement: Оценка масштаба только по обнаруженным профилям переоценивает предсказанный
    сигнал в профилях без обнаружения; данные поддерживают общий масштаб на физически
    согласованный instrument_block_id и явный учёт необнаруженных линий.
  evidence:
  - kind: legacy_summary
    source: Archive/legacy/KnowledgeBase_v2.0/00_Project/PROJECT_STATE.md
  review_date: '2026-08-28'
  validation_criteria:
  - Привязать profile-area table и Stage 03C audit outputs.
