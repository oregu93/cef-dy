      derivation_chain:
      - Stage01 parsed the recorded detector, monitor, e, q, h, k, l, and temp columns.
      - Stage02 selected fixed-HKL energy spectra and coadded repeat bins by summing
        detector counts and monitor exposure.
      - Stage02 blind search yielded F002 at 18.255809880373345 meV with median matched-filter
        FWHM 2.5 meV.
      - Stage03A fit 46 spectrum groups simultaneously in a ±6 meV window with one
        shared centroid, one empirical FWHM per legacy instrument block, one nonnegative
        unit-area Gaussian area per spectrum, and an independent positive log-polynomial
        background per spectrum.
      - Poisson-deviance least-squares fits compared background orders 0, 1, and 2;
        BIC selected order 1.
      - Total centroid sigma is sqrt(statistical covariance sigma^2 + background-family
        center half-range^2).
