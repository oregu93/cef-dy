schema_version: 2
schema_id: TAIPAN_PREPARED_NUMERICAL_EQ_MAP_V1
scientific_status: EXPLORATORY_NOT_MANUSCRIPT_ADMITTED
intensity_domain: LINEAR_PRE_DISPLAY
forbidden_sources: [PNG, JPEG, RENDERED_COLOUR_MAP, LOG_DISPLAY_VALUES]
required_columns:
  point_id: {type: string, constraint: unique_nonempty}
  scan_record_id: {type: string, role: Stage02R_provenance}
  raw_scan_id: {type: string, role: raw_provenance}
  point_index: {type: integer, constraint: nonnegative}
  energy_meV: {type: finite_float, units: meV}
  Ei_meV: {type: positive_finite_float, units: meV}
  Ef_meV: {type: positive_finite_float, units: meV}
  h_pbnm: {type: finite_float}
  k_pbnm: {type: finite_float}
  l_pbnm: {type: finite_float}
  Q_Ainv: {type: positive_finite_float, units: inverse_angstrom}
  qhat_direct_x: {type: finite_float, frame: direct_b_c_a}
  qhat_direct_y: {type: finite_float, frame: direct_b_c_a}
  qhat_direct_z: {type: finite_float, frame: direct_b_c_a}
  detector_counts: {type: nonnegative_finite_float}
  monitor: {type: positive_finite_float}
  time: {type: positive_finite_float}
  count_control_mode: {type: enum, values: [monitor_controlled, time_controlled]}
  instrument_config_id: {type: string}
  normalization_compatibility_group_id: {type: string}
  acquisition_state_id: {type: string}
  lattice_state_id: {type: string}
  UB_state_id: {type: string}
  temperature_status: {type: enum, values: [VERIFIED, RECONSTRUCTED_WITH_EXPLICIT_LIMITATION, NOT_YET_ESTABLISHED]}
  temperature_K_if_verified: {type: positive_finite_float_or_empty, units: K}
  temperature_scan_mean_K: {type: positive_finite_float, units: K}
  temperature_scan_min_K: {type: positive_finite_float, units: K}
  temperature_scan_max_K: {type: positive_finite_float, units: K}
  temperature_source_field: {type: string}
  temperature_controller_channel: {type: string}
  temperature_unit: {type: enum, values: [K]}
  discovery_holdout_role: {type: enum, values: [discovery]}
  intensity_linear: {type: finite_float, domain: linear_pre_display}
  intensity_units: {type: string}
  feature_id: {type: semicolon_separated_string, role: overlapping_B001_windows}
  validity_status: {type: string}
  mask_flags: {type: semicolon_separated_string}
  source_artifact: {type: string}
  source_commit: {type: semicolon_separated_git_commit}
  normalized_intensity: {type: finite_float, domain: linear_pre_display}
  instrument_block_id: {type: string, role: nuisance_scale_group}
  scan_id: {type: string, role: provenance}
  mask_status: {type: string, include_value: INCLUDE}
  normalization_metadata: {type: string, role: exact_preparation_description}
optional_columns:
  normalized_intensity_sigma: {type: positive_finite_float, completeness: all_or_none}
  background_metadata: {type: string}
  constraint_class:
    type: enum
    values:
      - ENERGY_CONSTRAINT
      - SPECTRAL_SHAPE_CONSTRAINT
      - EXPLORATORY_RELATIVE_INTENSITY_CONSTRAINT
forbidden_columns:
  - log_intensity
  - log10_intensity
  - display_intensity
  - colour_value
  - color_value
  - pixel_value
notes:
  - A missing or invalid qhat_direct triplet excludes the point; powder averaging is forbidden.
  - The canonical exploratory table contains B001 discovery rows only; holdout detector values are never materialized.
  - Multiple overlapping feature IDs are preserved and are not mandatory CEF-level assignments.
  - Statistical chi-square language is forbidden unless uncertainty calibration is separately reviewed.
  - Scan-dependent optimizer rescaling is forbidden; use declared instrument blocks only.
  - Feature-level energy constraints come only from ACTIVE_CEF_FEATURE rows in the reviewed feature table, not point rows or nearest-level matching.
