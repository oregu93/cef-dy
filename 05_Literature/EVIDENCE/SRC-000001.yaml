source_id: SRC-000001
evidence_record_version: 1
evidence:
- evidence_id: EV-SRC000001-001
  category: INTERPRETED_BY_AUTHORS
  claim: In low-symmetry CEF determination, agreement with the available experimental information does not by itself establish a unique parameter set. Global search should locate all compatible regions of CEF parameter space; if several regions remain compatible, additional independent information is required to obtain a unique solution.
  locator:
    page: PDF pp. 5, 7-8; printed pp. 3, 5-6
    section: Introduction; §§2.1-2.2
  review_state: reviewed_01
- evidence_id: EV-SRC000001-002
  category: INTERPRETED_BY_AUTHORS
  claim: INS transition energies and transition intensities provide distinct information for CEF determination. The intensities depend on transition matrix elements and level populations, so intensity-sensitive information can constrain solutions that are not distinguished by energies alone.
  locator:
    page: approximately PDF pp. 7, 11-15
    section: §§2.2, 2.4
  review_state: reviewed_01
