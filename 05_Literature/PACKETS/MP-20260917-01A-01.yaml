  - operation_id: OP-003
    type: EVIDENCE_ADD
    source_ref: SRC-PENDING-klementev-1994-iae5822-9
    payload:
      category: INTERPRETED_BY_AUTHORS
      claim: >-
        In low-symmetry CEF determination, agreement with the available
        experimental information does not by itself establish a unique
        parameter set. Global search should locate all compatible regions
        of CEF parameter space; if several regions remain compatible,
        additional independent information is required to obtain a unique
        solution.
      locator:
        page: "PDF pp. 5, 7-8; printed pp. 3, 5-6"
        section: "Introduction; §§2.1-2.2"
      review_state: reviewed_01

  - operation_id: OP-004
    type: EVIDENCE_ADD
    source_ref: SRC-PENDING-klementev-1994-iae5822-9
    payload:
      category: INTERPRETED_BY_AUTHORS
      claim: >-
        INS transition energies and transition intensities provide distinct
        information for CEF determination. The intensities depend on
        transition matrix elements and level populations, so
        intensity-sensitive information can constrain solutions that are
        not distinguished by energies alone.
      locator:
        page: "approximately PDF pp. 7, 11-15"
        section: "§§2.2, 2.4"
      review_state: reviewed_01

  - operation_id: OP-005
    type: EVIDENCE_ADD
    source_ref: SRC-PENDING-scheie-2022-cef-uncertainty
    payload:
      category: DERIVED
      claim: >-
        Numerical uncertainty mapping of CEF fits to simulated INS spectra
        shows that CEF parameters and derived quantities can remain poorly
        constrained even when the fitted neutron spectra are visually
        excellent and fitted level energies have small uncertainties.
      locator:
        section: "Abstract; §3 Results; §4 Discussion and Conclusions"
      review_state: reviewed_01

  - operation_id: OP-006
    type: EVIDENCE_ADD
    source_ref: SRC-PENDING-scheie-2022-cef-uncertainty
    payload:
      category: INTERPRETED_BY_AUTHORS
      claim: >-
        When available neutron observables do not sufficiently constrain
        the CEF Hamiltonian, additional independent constraints are required
        for physically meaningful parameter determination.
      locator:
        section: "Abstract; §4 Discussion and Conclusions"
      review_state: reviewed_01

