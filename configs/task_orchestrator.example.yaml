schema_version: 1
mode: shadow
repository_root: .
state_dir: CEF_Dy_Backup/task_orchestrator
poll_interval_seconds: 300
lock_stale_after_seconds: 900
orphaned_run_after_seconds: 1800
max_concurrent_workers: 2
max_concurrent_llm_runs: 1

github:
  enabled: false
  repository: oregu93/cef-dy
  task_label: orchestrator:task
  attention_issue: null
  track_manual_edits: true
  api_base: https://api.github.com
  token_env: GITHUB_TOKEN
  timeout_seconds: 20
  max_pages: 10
  backoff_initial_seconds: 5
  backoff_max_seconds: 300

llm:
  dispatch_enabled: false
  paid_fallback_allowed: false
  require_issue_label: orchestrator:llm-approved
  require_local_approval: true
  require_explicit_resume: true
  detached_workers: true
  lease_seconds: 1200
  quota_probe_guard_seconds: 60
  quota_probe_backoff_seconds: [300, 900, 1800, 3600]
  command:
    argv: [/usr/lib/chatgpt/resources/codex, exec, --ephemeral, --sandbox, read-only, --skip-git-repo-check, --output-last-message, "{output}", -]
    probe_prompt: "Reply with exactly ADMISSION_OK and do not use tools."
    timeout_seconds: 900
  ollama:
    enabled: false
    base_url: http://127.0.0.1:11434
    model: ""
    timeout_seconds: 30

# Read-only planning projections. UNKNOWN/stale quota blocks unattended
# quota-consuming eligibility but not explicit interactive work. reset_at is
# descriptive and never resumes PAUSED_QUOTA.
visibility:
  enabled: false
  quota_stale_after_seconds: 900
  quota:
    five_hour: {state: UNKNOWN, observed_at: null, reset_at: null}
    weekly: {state: UNKNOWN, observed_at: null, reset_at: null}

# M1 provides only durable local previews/outbox interfaces. No live publisher
# is wired by this example configuration.
publishing:
  enabled: false
  preview_only: true
  trusted_authors: []

# Persistent-chat history is not observable by the orchestrator. Only explicit
# observations may be stored; missing/stale telemetry projects as UNKNOWN.
chat_health:
  enabled: false
  observation_stale_after_seconds: 86400

# The cycle itself is deterministic; optional AI work is a disposable bounded
# subprocess and is disabled until explicitly enabled in local production config.
autonomy:
  enabled: false
  plan_only: false
  away_mode: false
  max_batch_tasks: 1
  max_parallel_local: 1
  checkpoint_subdir: autonomy
  result_inbox_subdir: result-inbox
  evidence_subdir: m1b-evidence

# M2 is an additive routing layer. Each bounded AI worker receives the exact
# canonical specialist section from CHAT_BOOTSTRAPS.md.
routing:
  enabled: false
  bootstrap_path: 03_Protocols/CHAT_BOOTSTRAPS.md
  auto_create_reviews: true

# Separate localhost-only read-only service. SQLite remains the source of truth.
dashboard:
  enabled: false
  host: 127.0.0.1
  port: 8765
  stale_after_seconds: 300
  recent_events: 100

paths:
  allowed_read_roots:
    - .
  forbidden_patterns:
    - .git/**
    - CEF_Dy_Data/**
    - private/**
    - secrets/**
    - credentials/**
    - 04_Results/raw/**
    - 04_Results/intermediate/**
  allowed_output_root: CEF_Dy_Backup/task_orchestrator

commands:
  allow:
    kb_validate:
      argv: [python, scripts/kb_validate.py, --strict]
      timeout_seconds: 300
    kb_refresh_check:
      argv: [python, scripts/kb_refresh.py, --check]
      timeout_seconds: 120
