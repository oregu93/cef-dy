schema_version: 1
pipeline_id: USER_EXECUTED_JOINT_CEF_PIPELINE_V1
scientific_status: EXPLORATORY_NOT_MANUSCRIPT_ADMITTED
scientific_scope:
  ion: Dy3+
  J: 7.5
  gJ: 1.3333333333333333
  internal_parameter_basis: direct_positive_q
  internal_axes: [b, c, a]
  publication_parameter_basis: canonical_Cs15
  publication_axes: [b, -a, c]
  exchange_enabled: false
  unique_hamiltonian_claim_allowed: false

switches:
  RUN_EXPLORATORY_SEARCH: false
  ENABLE_JOINT_MH_FIT: false
  ENABLE_MANUSCRIPT_OBJECTIVE: false

inputs:
  taipan_reuse_map: configs/taipan_prior_artifact_reuse_v1.yaml
  auto_materialize_stage02r: true
  taipan_eq_dataset: local_data/taipan_eq_map_exploratory_v1.csv
  taipan_schema: schemas/taipan-eq-map-v1.schema.yaml
  taipan_mask_definition: configs/taipan_masks_exploratory_v1.yaml
  cx02_priority_scan_preflight: configs/taipan_cx02_priority_scan_preflight_v1.yaml
  intensity_domain: LINEAR_PRE_DISPLAY
  normalization_description: >-
    Linear detector_counts / monitor with multiplier 1.0, preserving original
    detector and monitor values. No scan-dependent rescaling is introduced.
    One nuisance scale is profiled per A003 instrument/normalization block.
  uncertainties_statistically_calibrated: false
  literature_magnetization: data/manuscript_v1/literature_magnetization.csv
  literature_magnetization_inventory: data/manuscript_v1/literature_magnetization_curve_inventory.csv
  literature_magnetization_source_commit: 2c17955c405ef9698781dfd5364ef7be0245ba15
  historical_seed_bundle: 04_Results/Stage03R/STAGE03R-CS15-PREDICTION-BUNDLE-MATERIALIZATION-001/PB-CS15-HIST-B2-R7.yaml
  historical_seed_role: INITIALIZATION_ONLY_NOT_CURRENT_RESULT

objective:
  mode: EQ_MAP_EXPLORATORY_OBJECTIVE
  allowed_modes: [FEATURE_OBJECTIVE, EQ_MAP_EXPLORATORY_OBJECTIVE, MANUSCRIPT_OBJECTIVE]
  scientific_label: EXPLORATORY_TAIPAN_SPECTRUM_FIT
  residual_classes:
    - ENERGY_CONSTRAINT
    - SPECTRAL_SHAPE_CONSTRAINT
    - EXPLORATORY_RELATIVE_INTENSITY_CONSTRAINT
  nuisance_scale_bounds: [0.0001, 10000.0]
  component_definitions:
    L_energy: mean dimensionless residual loss for explicitly assigned feature energies
    L_shape: mean dimensionless residual loss in discovery feature windows
    L_relative_intensity: mean dimensionless residual loss outside feature windows
  component_weights:
    energy: 1.0
    shape: 1.0
    relative_intensity: 1.0
  uncertainties_statistically_calibrated: false
  manuscript_intensity_gate: FAIL_CLEANLY
  exploratory_eq_map_use: AUTHORIZED
  historical_energies_are_targets: false

forward_model:
  transition_model: PROJECT_CEF_KERNEL
  form_factor: DY3_J0_DIPOLE_APPROXIMATION
  q_direction_policy: PER_POINT_DIRECT_QHAT_REQUIRED__NO_POWDER_FALLBACK
  dy_site_intensity:
    status: IMPLEMENTED_AND_TESTED
    contract_id: STAGE03R-DY-SITE-TENSOR-TRANSFORM-CONTRACT-001
    contract_path: 04_Results/Stage03R/STAGE03R-DY-SITE-TENSOR-TRANSFORM-CONTRACT-001/CONVENTION_CONTRACT.yaml
    contract_sha256: a83d8250e37318ce6b4a883c8edc3a7508d76fad15cae6ddf2c4f6f4e49bd7b3
    frame: direct_b_c_a
    combination: INDEPENDENT_LOCALIZED_SITE_SUM
    site_order: [Dy1, Dy2, Dy3, Dy4]
    inter_site_dynamical_cross_correlations: false
  kinematic_factor:
    model: TAS_KF_OVER_KI
    require_measured_ei_ef: true
  population:
    mode: BOLTZMANN_ALL_CEF_STATES
    temperature_source: PREPARED_DATASET_VERIFIED_SAMPLE_TEMPERATURE
    exchange_enabled: false
  resolution:
    model: GAUSSIAN_FIXED_FWHM
    fwhm_meV: 0.894
    source_scan_raw_id: 104062
    source_Q_Ainv: 2.26
    fit_uncertainty_fwhm_meV: 0.025
    status: EMPIRICAL_ELASTIC_ANCHOR_AVAILABLE__FULL_TAS_RESOLUTION_NOT_ESTABLISHED
    transfer_systematic_represented: false
    fitted: false
  background:
    model: LOCAL_LINEAR_BACKGROUND
    source_semantics: B001_C001_EXPLORATORY_NUISANCE_ANCHOR
    dataset_already_background_subtracted: false
    profile_in_objective: true
    fitted: true
    clip_nonnegative: false
  normalization_nuisance:
    grouping_column: instrument_block_id
    one_scale_per_block: true
    scan_dependent_rescaling_allowed: false

assignments:
  strategy: EXPLICIT_SEPARATE_BRANCHES
  final_doublets: [1, 2, 3, 4, 5, 6, 7]
  feature_assignment_hypotheses: []
  automatic_nearest_level_assignment: false
  b001_features_are_mandatory_levels: false

pcm:
  A0_status: RETAINED_FORMAL_BASELINE
  A1_status: RETAINED_UNIFORM_SCALE_BASELINE
  A2_status: DEFERRED_NOT_AUTHORIZED

search:
  backend: CMA_ES
  run_exploratory_search: false
  assignment_branches: []
  h_bounds_meV: [-8.0, 8.0]
  sigma0_meV: 2.5
  population: 32
  restarts_per_assignment: 16
  max_evaluations_per_restart: 50000
  base_seed: 20261020
  best_candidates_per_restart: 1
  maximum_retained_candidates: 112
  checkpoint_every_generation: true
  resume_policy: RESTART_INCOMPLETE_RESTART_FROM_FIXED_SEED
  project_owned_kernel_reevaluation: true
  boundary_fraction: 0.02
  initialization_families:
    - family: PCM_FORMAL
      source: configs/manuscript_fit_v1.yaml#pcm.formal_parameters_meV
      role: INITIALIZATION_ONLY
    - family: PCM_M0
      source: 04_Results/ManuscriptCEFFitV1/MODEL_DEPENDENT_ENERGY_CONDITIONAL_V1/pcm_conditional_results.csv
      solution_id: PCM-M0__joint_w6.0_b1_per_block__D1
      role: INITIALIZATION_ONLY
    - family: HISTORICAL_R3
      source: 04_Results/Stage03R/STAGE03R-CS15-PREDICTION-BUNDLE-MATERIALIZATION-001/PB-CS15-HIST-B2-R3.yaml
      role: INITIALIZATION_ONLY
    - family: HISTORICAL_R5
      source: 04_Results/Stage03R/STAGE03R-CS15-PREDICTION-BUNDLE-MATERIALIZATION-001/PB-CS15-HIST-B2-R5.yaml
      role: INITIALIZATION_ONLY
    - family: HISTORICAL_R7
      source: 04_Results/Stage03R/STAGE03R-CS15-PREDICTION-BUNDLE-MATERIALIZATION-001/PB-CS15-HIST-B2-R7.yaml
      role: INITIALIZATION_ONLY
    - family: LATIN_HYPERCUBE
      source: DETERMINISTIC_SPACE_FILLING
      role: INITIALIZATION_ONLY

ensemble:
  retain_secondary_minima: true
  select_single_best: false
  retention_status: SEARCH_RETAINED_CANDIDATE
  scientific_compatibility_status: NOT_ASSESSED
  require_no_nuisance_boundary: false

magnetization:
  stage_role: FROZEN_SINGLE_ION_VALIDATION_ONLY
  axes: [a, b]
  temperatures_K: [10, 20]
  use_exact_experimental_field_points: true
  experimental_quantity: TOTAL_BULK_MAGNETIZATION
  calculated_quantity: SINGLE_ION_DY_CEF_CONTRIBUTION
  formal_chi_square_ranking_enabled: false
  c_axis_status: AMBIGUOUS_CURVE_IDENTITY
  blm_refit_enabled: false

joint_mh:
  enabled: false
  lambda_M: null
  accepted_bulk_contribution_model: null
  arbitrary_offset_allowed: false
  arbitrary_normalization_allowed: false

clustering:
  method: average
  distance_threshold: 1.0
  weights:
    parameter: 0.10
    energy: 0.25
    projector: 0.25
    neutron: 0.20
    g_tensor: 0.10
    magnetization: 0.10
  scales:
    parameter_meV: 1.0
    energy_meV: 1.0
    transition_strength: 1.0
    g_value: 1.0
    magnetization_muB: 1.0

mcphase:
  execution_enabled: false
  export_enabled: true
  mismatch_triggers_refit: false
  level_tolerance_meV: 0.000001

outputs:
  root: results/user_executed_joint_cef_pipeline_v1
  audit: 01_data_audit/audit_report.json
  dataset_diagnostic_figure: 01_data_audit/dataset_diagnostic.png
  forward: 02_cef_forward/forward_sanity.json
  pre_search_figure: 02_cef_forward/pre_search_diagnostic.png
  objective: 03_ins_objective/objective_sanity.json
  search: 04_global_search
  ensemble: 05_build_ins_ensemble/ins_ensemble.json
  mh: 06_calculate_mh/frozen_mh.json
  mh_comparison: 07_compare_mh/mh_diagnostics.json
  joint_interface: 08_joint_objective/interface_status.json
  clustering: 09_cluster_solutions/clusters.json
  wavefunctions: 10_export_wavefunctions
  mcphase: 11_export_mcphase
  mcphase_validation: 12_validate_mcphase/validation.json
